        - generic [ref=f1e114]: The University of Alabama. Dissertation on Thunder, an IaaS cloud architecture designed for smaller organizations. Four years teaching alongside it — introductory CS in Python and C as a graduate teaching assistant, and as an adjunct professor at Shelton State — which is where the argument for usability below stopped being abstract.
      - article [ref=f1e115]:
        - text: Doctoral research
        - generic [ref=f1e116]:
          - generic [ref=f1e117]:
            - 'heading "Thunder: a private cloud architecture designed for high usability" [level=3] [ref=f1e118]'
            - paragraph [ref=f1e119]: My dissertation asked how underfunded and understaffed organizations—especially schools, libraries, and nonprofit medical facilities—could gain the cost benefits of private cloud computing without the deployment and management burden of a general-purpose platform.
            - paragraph [ref=f1e120]:
              - text: "The name is recursive:"
              - strong [ref=f1e121]: THUNDER Helps Underfunded Nonprofits Distribute Electronic Resources.
          - generic [ref=f1e122]:
            - paragraph [ref=f1e123]: I designed and built a vertically integrated IaaS system that used PXE booting and preseeding for automated deployment, multicast discovery and a custom RPC layer for zero-touch node registration, and libvirt for virtual-machine orchestration. Controller, compute, and storage services could be expanded without interrupting the running cloud.
            - paragraph [ref=f1e124]: The research introduced RAIN—Rating Assisted Instantiation Negotiation—a scheduler that ranked compute nodes from real-time load metrics. Experiments found that it improved VM placement and avoided hardware over-utilization, especially in heterogeneous clusters, with the explicit tradeoff of slower placement decisions.
            - paragraph [ref=f1e125]: In comparative deployment studies, inexperienced users preferred Thunder's deployment model to OpenStack and Eucalyptus. The architecture also supported low-cost thin clients, browser-based guest access, and classroom teaching of virtualization, scalability, and elasticity.
