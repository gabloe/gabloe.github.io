            - paragraph [ref=f1e75]: My role is entirely within the engineering system that empowers developers across the Azure Local, Azure Stack Hub, and hybrid AKS organizations to build, test, validate, and release their products. I work on its architecture, CI, pipelines, frameworks, and services. It is not the infrastructure those products deliver; it is the internal system their engineers use to develop them.
            - paragraph [ref=f1e76]: Over eleven years, that work has grown from a product’s continuous integration pipelines into a service-oriented engineering system used across organizations. It provides full-stack test environments, provisioning, physical infrastructure lifecycle automation, and repeatable development workflows designed to be scalable and cost-conscious.
