              - generic [ref=f1e152]: 4 KiB · sustained payload
            - generic [ref=f1e153]:
              - strong [ref=f1e154]: ~7×
              - generic [ref=f1e155]: throughput after transport tuning
          - paragraph [ref=f1e156]: Apple M4 Max, macOS loopback, release build, QUIC with TLS 1.3. Latency uses per-message acknowledgements; throughput is sustained beyond the QUIC send window with bounded, lossless backpressure and zero dropped deliveries. Results are medians from repeated trials.
