    - generic [ref=f1e134]:
      - text: Personal project · what I'm building now
      - generic [ref=f1e136]:
        - generic [ref=f1e137]:
          - heading "Felix" [level=2] [ref=f1e138]
          - paragraph [ref=f1e139]: "A QUIC-based distributed event and cache system in Rust: low-latency pub/sub, durable streams, multiplexed caching, and multi-broker clustering."
          - paragraph [ref=f1e140]: It exists because some questions don't yield to reading about them. What does backpressure actually cost when one subscriber falls behind and the others aren't supposed to notice? Is a cache genuinely just a log with different semantics on top — and where does that claim break? What happens to an in-flight publish at the moment a leader's lease expires? Felix is where I find out, and the answers arrive as benchmarks and failing tests rather than as opinions.
          - paragraph [ref=f1e141]: Streams are sharded across broker owners selected with rendezvous hashing. A publish can enter through any broker and be forwarded to the owner; subscriptions follow bounded owner redirects and resume from their last offset. Durable streams use append-only log shipping, lease-fenced leaders, Leader or Quorum consistency, and caught-up replica promotion so quorum-acknowledged records survive leader failover.
          - paragraph [ref=f1e142]: The cluster suite exercises cross-broker routing, broker loss, process suspension, fencing, failover, redirects, reconnect, and single-node/cluster conformance. The system still prioritizes high fanout, predictable tail latency, and strict slow-consumer isolation; it remains in early active development while the control plane and operational model continue to evolve.
          - generic "Selected Felix benchmark results" [ref=f1e143]:
            - generic [ref=f1e144]:
              - strong [ref=f1e145]: 483 µs
              - generic [ref=f1e146]: p999 · 4 KiB · fanout 10
            - generic [ref=f1e147]:
              - strong [ref=f1e148]: 1.4M msg/s
              - generic [ref=f1e149]: 256 B · lossless delivery
            - generic [ref=f1e150]:
