      - text: How I work
      - heading "Three principles I build by" [level=2] [ref=f1e259]
      - paragraph [ref=f1e260]: Lessons carried across distributed systems, doctoral research, and production open source. Open one.
      - generic [ref=f1e261]:
        - generic [ref=f1e262]:
          - button "01 Backpressure belongs in the architecture A slow consumer should never be allowed to quietly become everyone else's outage. +" [ref=f1e263] [cursor=pointer]:
            - generic [ref=f1e264]: "01"
            - generic [ref=f1e265]:
              - generic [ref=f1e266]: Backpressure belongs in the architecture
              - generic [ref=f1e267]: A slow consumer should never be allowed to quietly become everyone else's outage.
            - generic [ref=f1e268]: +
          - region "01 Backpressure belongs in the architecture A slow consumer should never be allowed to quietly become everyone else's outage. +":
            - paragraph [ref=f1e269]: In Felix, publish batches are encoded once and shared across fanout, while each subscriber gets an isolated delivery stream. Byte-budgeted admission control at client and broker boundaries makes overload explicit and contains the cost of slow consumers instead of allowing it to spread through the system.
        - generic [ref=f1e270]:
          - button "02 Usability is a systems property A capable system still fails if its intended operators cannot deploy, understand, or recover it. +" [ref=f1e271] [cursor=pointer]:
            - generic [ref=f1e272]: "02"
            - generic [ref=f1e273]:
              - generic [ref=f1e274]: Usability is a systems property
              - generic [ref=f1e275]: A capable system still fails if its intended operators cannot deploy, understand, or recover it.
            - generic [ref=f1e276]: +
          - region "02 Usability is a systems property A capable system still fails if its intended operators cannot deploy, understand, or recover it. +":
            - paragraph [ref=f1e277]: "Thunder treated deployment and operation as architectural requirements: automated provisioning, zero-touch node discovery, and a deliberately smaller vertical stack. Comparative studies showed that inexperienced users preferred its deployment model to OpenStack and Eucalyptus—a reminder that operability is part of correctness."
