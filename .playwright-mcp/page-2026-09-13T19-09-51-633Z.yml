          - paragraph [ref=f1e49]: "I've been at Microsoft since 2015, now as a principal software engineer focused entirely on the engineering system: its architecture, continuous integration, pipelines, frameworks, and services. Born and raised in the Pacific Northwest and still here; the rain is good for staying indoors and reading flame graphs."
          - paragraph [ref=f1e50]: "My broader technical background spans distributed systems, cloud architecture, and service-oriented systems. I build primarily in Python and Rust, and the work I like best sits close to the wire: protocols, transports, storage, and the moments where a system has to decide who gets slowed down. Right now that means Felix, where the design discipline is simple — if a guarantee can't be enforced in code, it isn't a guarantee."
